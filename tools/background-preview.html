<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Genesis background preview</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#090b17;color:#b6cedb;font:14px system-ui;display:flex;height:100vh}
  aside{width:230px;padding:20px;flex-shrink:0}h1{font-size:19px;color:#5ddbe3}p{line-height:1.5}button{display:block;width:100%;margin:10px 0;padding:10px;background:#172238;color:#b9e8ee;border:1px solid #375270;cursor:pointer}button:disabled{opacity:.4}iframe{border:0;flex:1;height:100vh;min-width:0}output{display:block;white-space:pre-wrap;font:12px monospace;line-height:1.6}
</style>
<aside>
  <h1>Genesis backgrounds</h1>
  <p>Live, invulnerable test run. Uses the game's existing debug hook. These controls never save the test loadout.</p>
  <button data-action="baseline" disabled>Procedural baseline</button>
  <button data-action="generated" disabled>Generated layers</button>
  <button data-action="waves" disabled>Wave fight</button>
  <button data-action="dense" disabled>Dense fire</button>
  <button data-action="boss" disabled>Warden boss</button>
  <button data-action="boost" disabled>Toggle boost</button>
  <button data-action="freeze" disabled>Freeze / resume</button>
  <button data-action="benchmark" disabled>Compare rendering cost</button>
  <output id="status">Loading game…</output>
</aside>
<iframe title="Genesis live game"></iframe>
<script>
const frame = document.querySelector('iframe');
frame.addEventListener('load', () => {
  if(!frame.contentDocument.querySelector('#game')) return;
  const script = frame.contentDocument.createElement('script');
  script.type = 'module';
  script.src = new URL('background-preview-runtime.js', location.href).href;
  frame.contentDocument.body.append(script);
});
// Copy the game document into an iframe with in-memory storage installed before
// main.js loads. Debug runs can then award achievements without touching saves.
fetch('../index.html').then(response=>response.text()).then(html=>{
  const root=new URL('../',location.href).href;
  const storage=new URL('background-preview-storage.js',location.href).href;
  frame.srcdoc=html.replace('<head>', '<head><base href="'+root+'"><script src="'+storage+'"><'+'/script>');
}).catch(error=>document.querySelector('#status').textContent='Preview failed: '+error.message);
window.addEventListener('message', ({source, data}) => {
  if(source !== frame.contentWindow || data?.kind !== 'background-preview') return;
  document.querySelector('#status').textContent = data.status;
  if(data.ready) document.querySelectorAll('button').forEach(button => button.disabled=false);
});
document.querySelectorAll('button').forEach(button => button.addEventListener('click', () => {
  frame.contentWindow.postMessage({kind:'background-preview-action',action:button.dataset.action},location.origin);
}));
</script>
</html>
