<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEON OVERDRIVE · Item art</title>
<style>
body{margin:0;background:#060917;color:#dbe8ff;font:16px system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:40px 24px}h1{font-size:30px;margin:0 0 8px}p{color:#8fa6c4;line-height:1.6}header{display:flex;align-items:center;justify-content:space-between;gap:20px}button{background:#102432;color:#57e3f6;border:1px solid #285369;padding:10px 18px;cursor:pointer}h2{text-transform:uppercase;letter-spacing:.15em;font-size:15px;margin-top:40px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:16px}figure{margin:0;padding:16px 8px;background:#0c1122;border:1px solid #19273e;text-align:center}figure>img{width:112px;height:112px;object-fit:contain}figcaption{font-size:12px;overflow-wrap:anywhere;margin-top:12px;color:#afc6e5}.small{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:12px}.small img{object-fit:contain}.status{color:#8196b6;font-size:13px}a{color:#57e3f6}
</style>
<main><header><div><h1>NEON OVERDRIVE / Item art</h1><p>Generated artwork at inventory, card and HUD scales.</p></div><button id="refresh">Refresh</button></header><p id="status" class="status"></p><div id="groups"></div><p><a href="../index.html">Open game</a></p></main>
<script type="module">
async function render(){
 const wrap=document.querySelector('#groups');wrap.replaceChildren();let count=0;
 for(const group of ['upgrades','pilot','items','choices']){
  const response=await fetch(`../art/icons/${group}/manifest.json`,{cache:'no-store'});if(!response.ok)continue;
  const manifest=await response.json();const assets=manifest.assets || manifest.icons || [];const section=document.createElement('section');
  const title=document.createElement('h2');title.textContent=`${group} / ${assets.length}`;section.append(title);const grid=document.createElement('div');grid.className='grid';
  for(const a of assets){
   const runtime=a.runtime || a.runtimePath || a.path || `src/assets/icons/${group}/${a.id}.png`;const url=`../${runtime}`;
   const fig=document.createElement('figure');const img=document.createElement('img');img.src=url;img.alt=a.name||a.id;fig.append(img);
   const small=document.createElement('div');small.className='small';for(const size of [32,48]){const i=document.createElement('img');i.src=url;i.width=size;i.height=size;i.alt='';small.append(i);}fig.append(small);
   const caption=document.createElement('figcaption');caption.textContent=a.name||a.id;fig.append(caption);grid.append(fig);count++;
  }
  section.append(grid);wrap.append(section);
 }
 document.querySelector('#status').textContent=`${count} exported assets. Sources and prompts: art/icons.`;
}
document.querySelector('#refresh').addEventListener('click',render);render();
</script>
</html>
