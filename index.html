<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON GLITCH HELL: OVERDRIVE</title>
    <link rel="stylesheet" href="src/style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>
    <div id="game-container">
        <!-- SVG Filters Removed for Performance -->

        <div class="scanlines"></div>
        <div class="vignette"></div>
        <div id="flash-overlay"></div>
        <div id="low-health-vignette"></div>
        <div id="low-health-warning"></div>

        <div id="ui-layer" class="hidden">
            <div class="hud-top">
                <div class="hud-left">
                    <div class="stage-block">
                        <div class="score-label" style="color: #fff; font-size: 8px;">STAGE</div>
                        <div class="stage-row" style="display: flex; align-items: center; gap: 8px;">
                            <div id="stage-display"
                                style="font-size: 18px; font-weight: 900; color: #0ff; text-shadow: 0 0 10px #0ff; font-family: monospace;">
                                1</div>
                            <button class="score-pause" id="pause-btn" aria-label="Pause or Resume"
                                style="transform: scale(0.7);">
                                <div class="pause-icon" aria-hidden="true"></div>
                            </button>
                        </div>
                    </div>
                    <div class="score-block" style="margin-left: 15px;">
                        <div class="score-label">SCORE</div>
                        <div class="score-val" id="score-display">0</div>
                    </div>
                </div>
                <div class="hud-stack">
                    <div class="lives-box" id="lives-container"></div>
                    <div class="power-bar-container">
                        <div class="power-segments" id="power-segments">
                            <div class="segment"></div>
                            <div class="segment"></div>
                            <div class="segment"></div>
                            <div class="segment"></div>
                            <div class="segment"></div>
                        </div>
                        <div class="xp-track">
                            <div class="xp-fill" id="xp-fill"></div>
                        </div>
                        <div class="xp-status" id="xp-status"></div>
                    </div>
                </div>
                <div class="level-info-container">
                    <div class="level-label">
                        LVL <span id="player-level-display">1</span>
                    </div>
                    <div class="player-xp-track">
                        <div class="player-xp-fill" id="player-xp-fill"></div>
                    </div>
                </div>
            </div>
        </div>


        <div id="start-menu" class="menu-screen">
            <h1>NEON</h1>
            <button class="btn" id="start-btn">ENGAGE</button>
        </div>

        <div id="pause-menu" class="menu-screen hidden">
            <h1 style="color: #0ff;">PAUSED</h1>
            <div class="menu-actions">
                <button class="btn" id="resume-btn">RESUME</button>
                <button class="btn" id="pause-restart-btn">RESTART</button>
                <button class="btn" id="quit-btn">QUIT TO MENU</button>
            </div>
            <div class="debug-container">
                <details>
                    <summary>Debug</summary>
                    <div class="debug-options">
                        <div class="debug-option">
                            <label for="god-mode-checkbox">God Mode</label>
                            <input type="checkbox" id="god-mode-checkbox">
                        </div>
                        <div class="debug-option">
                            <button class="btn" id="add-health-btn">+1 Max Health</button>
                        </div>
                        <div class="debug-option">
                            <button class="btn" id="lvl-up-btn">Lvl Up</button>
                        </div>
                        <div class="debug-option">
                            <button class="btn" id="set-health-1-btn">Set Health to 1</button>
                        </div>
                    </div>
                </details>
            </div>
        </div>

        <div id="game-over-menu" class="menu-screen hidden">
            <h1 style="color: #f00;">CRITICAL FAIL</h1>
            <div style="color: #fff; margin-bottom: 10px; letter-spacing: 2px; font-size: 12px;">FINAL SCORE</div>
            <div id="final-score"
                style="font-size: 36px; color: #0ff; font-family: monospace; margin-bottom: 20px; text-shadow: 0 0 10px #0ff;">
                0</div>
            <button class="btn" id="restart-btn">REBOOT</button>
        </div>

        <div id="level-up-menu" class="menu-screen hidden">
            <h1 style="color: #fd0;">LEVEL UP!</h1>
            <div class="upgrade-container">
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

    <script src="src/globals.js"></script>
    <script src="src/levels.js"></script>
    <script src="src/utils.js"></script>
    <script src="src/audio.js"></script>
    <script src="src/assets.js"></script>
    <script src="src/pool.js"></script>
    <script src="src/bullet.js"></script>
    <script src="src/enemy.js"></script>
    <script src="src/particle.js"></script>
    <script src="src/powerup.js"></script>
    <script src="src/floatingText.js"></script>
    <script src="src/cosmicBackground.js"></script>
    <script src="src/pools.js"></script>
    <script src="src/ui.js"></script>
    <script src="src/spawners.js"></script>
    <script src="src/player.js"></script>
    <script src="src/game.js"></script>
</body>

</html>
