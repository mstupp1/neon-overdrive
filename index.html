<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON GLITCH HELL: OVERDRIVE</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #020002;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI LAYER */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            z-index: 20;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            align-items: flex-start;
        }

        .score-box {
            background: rgba(0, 0, 0, 0.6);
            border-left: 4px solid #0ff;
            padding: 8px 20px;
            color: #fff;
            text-shadow: 0 0 8px #0ff;
            transform: skewX(-10deg);
            backdrop-filter: blur(4px);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
        }

        .score-label { font-size: 12px; color: #0ff; letter-spacing: 3px; font-weight: 800; }
        .score-val { font-size: 28px; font-weight: bold; font-family: monospace; }

        .lives-box {
            display: flex;
            gap: 8px;
            transform: skewX(-10deg);
        }

        .life-icon {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #f00, #900);
            border: 2px solid #fff;
            box-shadow: 0 0 10px #f00;
            clip-path: polygon(20% 0%, 80% 0%, 100% 20%, 100% 100%, 80% 100%, 20% 100%, 0% 80%, 0% 20%);
        }

        /* Bottom Power Bar */
        .power-bar-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) skewX(-15deg);
            width: 260px;
            background: rgba(0,0,0,0.5);
            border-bottom: 3px solid #fff;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            backdrop-filter: blur(4px);
        }
        
        .power-bar-label {
            color: #0ff;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 4px;
            margin-bottom: 5px;
            text-shadow: 0 0 8px #0ff;
        }

        .power-segments {
            display: flex;
            gap: 4px;
            width: 100%;
            height: 10px;
        }

        .segment {
            flex: 1;
            background: rgba(255,255,255,0.1);
            transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .segment.active {
            background: #0ff;
            box-shadow: 0 0 10px #0ff;
            border-color: #fff;
        }
        
        .segment.max {
            background: #f0f;
            box-shadow: 0 0 15px #f0f;
            border-color: #fff;
        }

        /* Menus */
        .menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
            pointer-events: auto;
            backdrop-filter: blur(8px);
        }

        .hidden { display: none !important; }

        h1 {
            font-size: 60px;
            margin: 0 0 20px 0;
            color: #fff;
            letter-spacing: 8px;
            text-shadow: 4px 4px 0 #f0f, -4px -4px 0 #0ff;
            animation: glitch-anim 3s infinite;
            font-style: italic;
            text-transform: uppercase;
        }

        @keyframes glitch-anim {
            0% { transform: skew(0deg); text-shadow: 4px 4px 0 #f0f; }
            20% { transform: skew(-2deg); text-shadow: -4px 4px 0 #0ff; }
            40% { transform: skew(2deg); text-shadow: 4px -4px 0 #f0f; }
            60% { transform: skew(0deg); text-shadow: -4px -4px 0 #0ff; }
            100% { transform: skew(0deg); text-shadow: 4px 4px 0 #f0f; }
        }

        .btn {
            background: transparent;
            border: 2px solid #0ff;
            color: #fff;
            padding: 15px 60px;
            font-size: 22px;
            font-family: monospace;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 4px;
            transition: 0.2s;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            margin-top: 30px;
            font-weight: bold;
        }

        .btn:hover { background: rgba(0, 255, 255, 0.2); box-shadow: 0 0 30px #0ff; }
        .btn:active { background: #0ff; color: #000; }

        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 3px
            );
            pointer-events: none;
            z-index: 25;
        }

        #flash-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; opacity: 0; pointer-events: none; z-index: 22;
            transition: opacity 0.1s;
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>
    <div id="flash-overlay"></div>

    <div id="ui-layer" class="hidden">
        <div class="hud-top">
            <div class="score-box">
                <div class="score-label">SCORE</div>
                <div class="score-val" id="score-display">0</div>
            </div>
            <div class="lives-box" id="lives-container"></div>
        </div>
        
        <div class="power-bar-container">
            <div class="power-bar-label">WEAPON SYSTEMS</div>
            <div class="power-segments" id="power-segments">
                <div class="segment"></div>
                <div class="segment"></div>
                <div class="segment"></div>
                <div class="segment"></div>
                <div class="segment"></div>
            </div>
        </div>
    </div>

    <div id="start-menu" class="menu-screen">
        <h1>NEON<br>OVERDRIVE</h1>
        <button class="btn" id="start-btn">ENGAGE</button>
    </div>

    <div id="game-over-menu" class="menu-screen hidden">
        <h1 style="color: #f00;">CRITICAL FAIL</h1>
        <div style="color: #fff; margin-bottom: 10px; letter-spacing: 2px;">FINAL SCORE</div>
        <div id="final-score" style="font-size: 50px; color: #0ff; font-family: monospace; margin-bottom: 30px; text-shadow: 0 0 10px #0ff;">0</div>
        <button class="btn" id="restart-btn">REBOOT</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        /**
         * NEON GLITCH ENGINE V6: OVERDRIVE
         */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const uiLayer = document.getElementById('ui-layer');
        const startMenu = document.getElementById('start-menu');
        const gameOverMenu = document.getElementById('game-over-menu');
        const scoreDisplay = document.getElementById('score-display');
        const livesContainer = document.getElementById('lives-container');
        const powerSegments = document.getElementById('power-segments');
        const finalScoreDisplay = document.getElementById('final-score');
        const flashOverlay = document.getElementById('flash-overlay');

        // --- ASSET PRE-RENDERING ---
        const sprites = {};

        function renderGlowSprite(color, radius, glow, type='circle') {
            const size = (radius + glow) * 2;
            const c = document.createElement('canvas');
            c.width = size; c.height = size;
            const cx = c.getContext('2d');
            const center = size / 2;

            cx.shadowBlur = glow; cx.shadowColor = color;
            cx.fillStyle = '#fff';
            
            if(type==='circle') {
                cx.beginPath(); cx.arc(center, center, radius, 0, Math.PI*2); cx.fill();
            } else if (type==='beam') {
                // Long thin rectangle for beam shots
                cx.fillStyle = color;
                cx.fillRect(center-radius, center-radius*3, radius*2, radius*6);
                cx.fillStyle = '#fff';
                cx.fillRect(center-radius/2, center-radius*2, radius, radius*4);
            }
            return c;
        }

        function prerenderAssets() {
            sprites.enemyBullet = renderGlowSprite('#f00', 5, 10);
            sprites.playerNormal = renderGlowSprite('#0ff', 4, 8);
            sprites.playerBeam = renderGlowSprite('#0ff', 3, 15, 'beam'); // New Beam asset
            sprites.playerHoming = renderGlowSprite('#d0f', 4, 8);
            sprites.playerWave = renderGlowSprite('#50f', 5, 12);
        }
        prerenderAssets();

        // --- Audio ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            
            if (type === 'shoot') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                gain.gain.setValueAtTime(0.03, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'bomb') {
                // Bass drop
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(10, now + 1.0);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.linearRampToValueAtTime(0, now + 1.0);
                osc.start(now); osc.stop(now + 1.0);
            } else if (type === 'shieldBreak') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.3);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.linearRampToValueAtTime(0, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            }
        }

        // --- State ---
        let width, height;
        let globalHue = 0;
        let gameState = 'MENU';
        let score = 0;
        let frameCount = 0;

        const input = { x: 0, y: 0 };
        
        // --- Player Config ---
        const player = {
            x: 0, y: 0, radius: 8, // Hitbox radius
            w: 24, h: 32, // Visual size
            lives: 5, iframes: 0, powerLevel: 1, maxPower: 6,
            hasShield: false,
            tail: []
        };

        let bullets = [];
        let enemies = [];
        let particles = [];
        let powerups = [];
        let texts = [];

        // --- Resize ---
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            if(gameState === 'MENU') {
                player.x = width / 2; player.y = height * 0.8;
                input.x = player.x; input.y = player.y;
            }
        }
        window.addEventListener('resize', resize);
        resize();

        function updateInput(x, y) { input.x = x; input.y = y; }
        window.addEventListener('mousemove', e => updateInput(e.clientX, e.clientY));
        window.addEventListener('touchmove', e => { e.preventDefault(); updateInput(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
        window.addEventListener('touchstart', e => { updateInput(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });

        // --- Helpers ---
        const rand = (min, max) => Math.random() * (max - min) + min;
        const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
        function j(val, amt=3) { return val + Math.random()*amt - amt/2; }

        // --- Classes ---

        class Bullet {
            constructor(x, y, angle, speed, type, subType = 'normal') {
                this.x = x; this.y = y;
                this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
                this.angle = angle; this.speed = speed;
                this.type = type; this.subType = subType; 
                this.active = true;
                this.radius = 8;
                this.timer = 0; this.rotation = 0;
            }

            update() {
                this.timer++;
                this.x += this.vx; this.y += this.vy;
                
                if (this.subType === 'homing') {
                    // Find nearest enemy
                    let target = null;
                    let minDist = 400;
                    if (frameCount % 3 === 0) { // Optimization
                        for(let e of enemies) {
                            let d = dist(this.x, this.y, e.x, e.y);
                            if(d < minDist && e.y > 0) { minDist = d; target = e; }
                        }
                    }
                    
                    if(target) {
                        let angleTo = Math.atan2(target.y - this.y, target.x - this.x);
                        let diff = angleTo - this.angle;
                        while (diff < -Math.PI) diff += Math.PI * 2;
                        while (diff > Math.PI) diff -= Math.PI * 2;
                        this.angle += diff * 0.15;
                        this.vx = Math.cos(this.angle) * this.speed;
                        this.vy = Math.sin(this.angle) * this.speed;
                    }
                } else if (this.subType === 'blade') {
                    this.rotation += 0.3;
                    this.vx *= 0.99; this.vy *= 0.99; // Decelerate slightly
                }

                if (this.x < -50 || this.x > width + 50 || this.y < -50 || this.y > height + 50) this.active = false;
            }

            draw(ctx) {
                if (this.type === 'enemy') {
                    ctx.drawImage(sprites.enemyBullet, this.x - 15, this.y - 15);
                } else {
                    // Additive blending for player shots
                    ctx.globalCompositeOperation = 'lighter';
                    
                    if (this.subType === 'beam') {
                        ctx.save();
                        ctx.translate(this.x, this.y);
                        ctx.rotate(this.angle + Math.PI/2);
                        // Draw beam sprite stretched slightly
                        ctx.drawImage(sprites.playerBeam, -10, -20, 20, 40);
                        ctx.restore();
                    }
                    else if (this.subType === 'homing') {
                        ctx.drawImage(sprites.playerHoming, this.x - 12, this.y - 12);
                    } 
                    else if (this.subType === 'wave') {
                         ctx.drawImage(sprites.playerWave, this.x - 18, this.y - 18);
                    } 
                    else if (this.subType === 'blade') {
                        ctx.save();
                        ctx.translate(this.x, this.y);
                        ctx.rotate(this.rotation);
                        ctx.strokeStyle = '#0ff';
                        ctx.lineWidth = 3;
                        ctx.shadowBlur = 10; ctx.shadowColor = '#0ff';
                        ctx.beginPath();
                        ctx.moveTo(-15,0); ctx.lineTo(15,0); ctx.moveTo(0,-15); ctx.lineTo(0,15);
                        ctx.stroke();
                        ctx.restore();
                    }
                    else {
                         ctx.drawImage(sprites.playerNormal, this.x - 12, this.y - 12);
                    }
                    ctx.globalCompositeOperation = 'source-over';
                }
            }
        }

        class Enemy {
            constructor(type) {
                this.type = type; this.active = true; this.hp = 1;
                // Spawn Logic
                const seed = Math.random();
                if (seed > 0.3) { this.x = rand(50, width - 50); this.y = -40; } 
                else { this.x = Math.random()>0.5 ? width+40 : -40; this.y = rand(20, height*0.4); }

                if (type === 'chaser') { this.hp = 4; this.radius = 18; this.speed = rand(2, 3.5); } 
                else if (type === 'spinner') { this.hp = 15; this.radius = 25; this.speed = 1.5; this.timer = 0; } 
                else if (type === 'dasher') { this.hp = 3; this.radius = 12; this.speed = 6; 
                    const a = Math.atan2(player.y - this.y, player.x - this.x);
                    this.vx = Math.cos(a)*this.speed; this.vy = Math.sin(a)*this.speed;
                } 
                else if (type === 'snake') {
                    this.hp = 20; this.radius = 15; this.segments = [];
                    for(let i=0; i<8; i++) this.segments.push({x:this.x, y:this.y - i*15});
                } 
                else if (type === 'sniper') {
                    this.hp = 6; this.radius = 20; this.state = 'move'; this.timer = 0;
                    this.tx = rand(50, width-50); this.ty = rand(50, height*0.4);
                }
            }

            update() {
                if (this.type === 'chaser') {
                    const a = Math.atan2(player.y - this.y, player.x - this.x);
                    this.x += Math.cos(a) * this.speed; this.y += Math.max(1, Math.sin(a) * this.speed);
                } 
                else if (this.type === 'spinner') {
                    this.y += 0.8; this.x += Math.sin(frameCount * 0.03); 
                    this.timer++;
                    if (this.timer > 60) {
                        this.timer = 0;
                        for(let i=0; i<6; i++) bullets.push(new Bullet(this.x, this.y, i*(Math.PI/3)+frameCount*0.1, 4, 'enemy'));
                    }
                } 
                else if (this.type === 'dasher') { this.x += this.vx; this.y += this.vy; }
                else if (this.type === 'snake') {
                    this.x += Math.sin(frameCount * 0.05) * 3; this.y += 2;
                    let p = {x:this.x, y:this.y};
                    this.segments.forEach(s => { s.x += (p.x-s.x)*0.3; s.y += (p.y-s.y)*0.3; p = {x:s.x, y:s.y}; });
                }
                else if (this.type === 'sniper') {
                    if(this.state === 'move') {
                        this.x += (this.tx - this.x) * 0.05; this.y += (this.ty - this.y) * 0.05;
                        if(Math.abs(this.x - this.tx) < 5) { this.state = 'aim'; this.timer = 0; }
                    } else if (this.state === 'aim') {
                        this.timer++;
                        if(this.timer > 50) {
                            const a = Math.atan2(player.y - this.y, player.x - this.x);
                            bullets.push(new Bullet(this.x, this.y, a, 15, 'enemy'));
                            this.tx = rand(50, width-50); this.ty = rand(50, height*0.4); this.state = 'move';
                        }
                    }
                }
                if (this.y > height + 100 || this.x < -100 || this.x > width + 100) this.active = false;
            }

            draw(ctx) {
                ctx.save(); ctx.translate(this.x, this.y);
                ctx.strokeStyle = '#f44'; ctx.lineWidth = 2;

                if (this.type === 'chaser') {
                    ctx.beginPath(); ctx.moveTo(0, j(15)); ctx.lineTo(j(-12),j(-12)); ctx.lineTo(j(12),j(-12)); ctx.closePath(); ctx.stroke();
                } else if (this.type === 'spinner') {
                    ctx.rotate(frameCount * 0.05);
                    ctx.strokeRect(j(-18), j(-18), 36, 36); ctx.strokeRect(j(-10), j(-10), 20, 20);
                } else if (this.type === 'dasher') {
                    ctx.rotate(Math.atan2(this.vy, this.vx));
                    ctx.beginPath(); ctx.moveTo(18,0); ctx.lineTo(-12,10); ctx.lineTo(-12,-10); ctx.closePath(); ctx.stroke();
                } else if (this.type === 'snake') {
                    ctx.fillStyle = '#f00'; ctx.fillRect(-10,-10,20,20);
                    ctx.restore(); ctx.save();
                    this.segments.forEach((s, i) => {
                        ctx.strokeStyle = `rgba(255, 50, 50, ${1-i/10})`; ctx.strokeRect(j(s.x-10), j(s.y-10), 20, 20);
                    });
                } else if (this.type === 'sniper') {
                    ctx.beginPath(); ctx.arc(0,0,12,0,Math.PI*2); ctx.stroke();
                    if(this.state==='aim') {
                        ctx.restore(); ctx.save(); ctx.strokeStyle=`rgba(255,0,0,${this.timer/50})`;
                        ctx.beginPath(); ctx.moveTo(this.x,this.y); ctx.lineTo(player.x,player.y); ctx.stroke();
                    }
                }
                ctx.restore();
            }
        }

        class PowerUp {
            constructor(x, y, type = null, isKnockout = false) {
                this.x = x; this.y = y; this.active = true; this.radius = 16;
                this.isKnockout = isKnockout;
                if(isKnockout) { const a=Math.random()*6.28; this.vx=Math.cos(a)*6; this.vy=Math.sin(a)*6; }
                else { this.vx=0; this.vy=2; }
                
                if(type) this.type = type;
                else {
                    const r = Math.random();
                    if (r > 0.97) this.type = 'bomb'; // Rare
                    else if (r > 0.90) this.type = 'shield'; // Uncommon
                    else if (r > 0.80) this.type = 'life';
                    else this.type = 'weapon';
                }
            }
            update() {
                this.x+=this.vx; this.y+=this.vy;
                if(this.isKnockout) { this.vx*=0.95; this.vy*=0.95; if(this.x<0||this.x>width)this.vx*=-1; if(this.y<0||this.y>height)this.vy*=-1; }
                if (this.y > height + 50) this.active = false;
            }
            draw(ctx) {
                ctx.save(); ctx.translate(this.x, this.y);
                const s = 1 + Math.sin(frameCount*0.2)*0.3; ctx.scale(s,s);
                
                let c='#fff', t='?';
                if(this.type==='weapon') { c='#0ff'; t='W'; }
                else if(this.type==='bomb') { c='#ff0'; t='B'; }
                else if(this.type==='shield') { c='#00f'; t='S'; }
                else if(this.type==='life') { c='#f00'; t='♥'; }

                ctx.shadowBlur=20; ctx.shadowColor=c;
                
                if(this.type === 'bomb') {
                     // Bomb specific pulse
                     ctx.beginPath(); ctx.arc(0,0,this.radius+5,0,Math.PI*2); 
                     ctx.fillStyle = `rgba(255, 255, 0, ${0.3 + Math.sin(frameCount*0.5)*0.2})`; ctx.fill();
                }
                
                ctx.strokeStyle=c; ctx.lineWidth=3;
                ctx.beginPath(); ctx.arc(0,0,this.radius,0,Math.PI*2); ctx.stroke();
                ctx.fillStyle=c; ctx.font='bold 18px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
                ctx.fillText(t,0,2);
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color, speed=5) {
                this.x=x; this.y=y; const a=Math.random()*6.28;
                this.vx=Math.cos(a)*speed; this.vy=Math.sin(a)*speed;
                this.life=1; this.decay=rand(0.02,0.05); this.color=color;
            }
            update() { this.x+=this.vx; this.y+=this.vy; this.life-=this.decay; }
            draw(ctx) {
                ctx.globalAlpha=this.life; ctx.fillStyle=this.color;
                ctx.fillRect(this.x, this.y, 4, 4); ctx.globalAlpha=1;
            }
        }

        class FloatingText {
            constructor(x,y,text,color){this.x=x;this.y=y;this.text=text;this.color=color;this.life=1;}
            update(){this.y-=1; this.life-=0.02;}
            draw(ctx){ ctx.globalAlpha=this.life; ctx.fillStyle=this.color; ctx.font="bold 24px monospace"; ctx.fillText(this.text,this.x,this.y); ctx.globalAlpha=1; }
        }

        // --- Game Logic ---

        function spawnEnemy() {
            const chance = Math.random();
            let type = 'chaser';
            if(score>500 && chance>0.6) type='spinner';
            if(score>1000 && chance>0.8) type='dasher';
            if(score>2000 && chance>0.85) type='snake';
            if(score>3000 && chance>0.9) type='sniper';
            enemies.push(new Enemy(type));
        }

        function createExplosion(x, y, color, count) {
            for(let i=0; i<count; i++) particles.push(new Particle(x, y, color));
        }

        function triggerBomb() {
            playSound('bomb');
            flashOverlay.style.opacity = 1;
            setTimeout(()=>flashOverlay.style.opacity=0, 500);
            
            // Kill everything
            enemies.forEach(e => {
                e.active = false;
                createExplosion(e.x, e.y, '#ff0', 15);
            });
            bullets.forEach(b => {
                if(b.type === 'enemy') {
                    b.active = false;
                    createExplosion(b.x, b.y, '#ff0', 2);
                }
            });
            
            score += 2000;
            updateUI();
            texts.push(new FloatingText(width/2, height/2, "OMEGA BLAST", "#ff0"));
        }

        function updateUI() {
            scoreDisplay.innerText = score;
            livesContainer.innerHTML = '';
            for(let i=0; i<player.lives; i++) {
                const l = document.createElement('div'); l.className='life-icon';
                livesContainer.appendChild(l);
            }
            
            // Power Bar
            const segs = powerSegments.children;
            for(let i=0; i<segs.length; i++) {
                segs[i].className = i < player.powerLevel-1 ? 'segment active' : 'segment';
                if(player.powerLevel===player.maxPower && i < player.maxPower-1) segs[i].className = 'segment max';
            }
        }

        function hitPlayer() {
            // Shield Check
            if (player.hasShield) {
                player.hasShield = false;
                playSound('shieldBreak');
                createExplosion(player.x, player.y, '#00f', 20);
                player.iframes = 60;
                texts.push(new FloatingText(player.x, player.y-50, "SHIELD DOWN", "#00f"));
                return;
            }

            player.lives--;
            player.iframes = 120;
            playSound('hit');
            flashOverlay.style.opacity = 0.5; setTimeout(()=>flashOverlay.style.opacity=0, 100);
            createExplosion(player.x, player.y, '#f00', 25);
            
            if (player.powerLevel > 1) {
                player.powerLevel--;
                powerups.push(new PowerUp(player.x, player.y, 'weapon', true));
                texts.push(new FloatingText(player.x, player.y-50, "SYSTEM DMG", "#f00"));
            }
            updateUI();
            if (player.lives <= 0) {
                gameState = 'GAMEOVER';
                uiLayer.classList.add('hidden');
                gameOverMenu.classList.remove('hidden');
                finalScoreDisplay.innerText = score;
            }
        }

        function initGame() {
            score = 0; player.lives = 5; player.powerLevel = 1; player.iframes = 0; player.hasShield = false;
            player.x = width/2; player.y = height/2;
            bullets = []; enemies = []; particles = []; powerups = []; texts = [];
            updateUI();
            gameState = 'PLAYING';
            uiLayer.classList.remove('hidden');
            startMenu.classList.add('hidden');
            gameOverMenu.classList.add('hidden');
        }

        function loop() {
            requestAnimationFrame(loop);
            if (gameState !== 'PLAYING') {
                globalHue += 1;
                ctx.fillStyle = 'rgba(0,0,0,0.1)'; ctx.fillRect(0,0,width,height);
                return;
            }

            globalHue += 2;
            frameCount++;
            
            if (frameCount % Math.max(20, 60 - Math.floor(score/300)) === 0) spawnEnemy();

            // Move Player
            player.x += (input.x - player.x) * 0.2;
            player.y += (input.y - player.y) * 0.2;
            // Engine trails
            if(frameCount%2===0) player.tail.push({x:player.x, y:player.y+15, life:1});
            player.tail.forEach(t=>t.life-=0.1);
            player.tail = player.tail.filter(t=>t.life>0);

            // --- SHOOTING (SCALED) ---
            if (frameCount % 7 === 0) {
                playSound('shoot');
                // LVL 1: Center Stream
                bullets.push(new Bullet(player.x, player.y-20, -Math.PI/2, 18, 'player', 'beam'));
                
                // LVL 2: Side Streams
                if(player.powerLevel >= 2) {
                    bullets.push(new Bullet(player.x-15, player.y, -1.7, 15, 'player', 'normal'));
                    bullets.push(new Bullet(player.x+15, player.y, -1.4, 15, 'player', 'normal'));
                }
                // LVL 3: Blades
                if(player.powerLevel >= 3 && frameCount%14===0) {
                    bullets.push(new Bullet(player.x, player.y-20, -1.6, 10, 'player', 'blade'));
                    bullets.push(new Bullet(player.x, player.y-20, -1.5, 10, 'player', 'blade'));
                }
                // LVL 4: Homing
                if(player.powerLevel >= 4 && frameCount%21===0) {
                    bullets.push(new Bullet(player.x-20, player.y, Math.PI, 12, 'player', 'homing'));
                    bullets.push(new Bullet(player.x+20, player.y, 0, 12, 'player', 'homing'));
                }
                // LVL 5: Wave
                if(player.powerLevel >= 5 && frameCount%21===0) {
                     bullets.push(new Bullet(player.x, player.y-10, -Math.PI/2, 12, 'player', 'wave'));
                }
                // LVL 6: MAX POWER (More Beams)
                if(player.powerLevel >= 6) {
                    bullets.push(new Bullet(player.x-10, player.y-20, -Math.PI/2, 18, 'player', 'beam'));
                    bullets.push(new Bullet(player.x+10, player.y-20, -Math.PI/2, 18, 'player', 'beam'));
                }
            }
            if(player.iframes>0) player.iframes--;

            // Update
            [bullets, enemies, particles, powerups, texts].forEach(arr => arr.forEach(e => e.update()));
            bullets = bullets.filter(e=>e.active); enemies = enemies.filter(e=>e.active);
            particles = particles.filter(e=>e.life>0); powerups = powerups.filter(e=>e.active);
            texts = texts.filter(e=>e.life>0);

            // Collisions
            bullets.forEach(b => {
                if(b.type==='player'){
                    enemies.forEach(e=>{
                        let hit = dist(b.x,b.y,e.x,e.y) < e.radius+b.radius+5;
                        if(e.type==='snake') { // Snake specific hit check
                             if(dist(b.x,b.y,e.x,e.y)<e.radius+b.radius) hit=true;
                             else e.segments.forEach(s=>{if(dist(b.x,b.y,s.x,s.y)<e.radius+b.radius)hit=true;});
                        }

                        if(hit){
                            if(b.subType!=='blade' && b.subType!=='wave') b.active=false;
                            e.hp -= (b.subType==='blade'||b.subType==='wave'?0.5:1);
                            createExplosion(b.x, b.y, '#fff', 1);
                            if(e.hp<=0 && e.active){
                                e.active=false; score+=100; updateUI();
                                createExplosion(e.x,e.y,`hsl(${globalHue},100%,50%)`, 15);
                                if(Math.random()<0.08) powerups.push(new PowerUp(e.x,e.y));
                            }
                        }
                    });
                } else {
                    if(player.iframes<=0 && dist(b.x,b.y,player.x,player.y)<player.radius+5){
                        b.active=false; hitPlayer();
                    }
                }
            });
            enemies.forEach(e => {
                let hit = dist(e.x,e.y,player.x,player.y) < e.radius+player.radius;
                if(e.type==='snake') e.segments.forEach(s=>{if(dist(s.x,s.y,player.x,player.y)<e.radius+player.radius)hit=true;});
                if(player.iframes<=0 && hit) hitPlayer();
            });
            powerups.forEach(p => {
                if(dist(p.x,p.y,player.x,player.y) < p.radius+20) {
                    p.active=false; playSound('powerup');
                    if(p.type==='weapon'){
                        if(player.powerLevel<player.maxPower) { player.powerLevel++; texts.push(new FloatingText(player.x,player.y-40,"UPGRADE","#0ff")); }
                        else { score+=1000; texts.push(new FloatingText(player.x,player.y-40,"+1000","#fff")); }
                    } else if(p.type==='bomb') { triggerBomb(); }
                    else if(p.type==='shield') { player.hasShield=true; texts.push(new FloatingText(player.x,player.y-40,"SHIELD UP","#00f")); }
                    else if(p.type==='life') { player.lives++; texts.push(new FloatingText(player.x,player.y-40,"EXTEND","#f00")); }
                    updateUI();
                }
            });

            // --- DRAW ---
            ctx.fillStyle = 'rgba(2, 0, 5, 0.25)'; ctx.fillRect(0,0,width,height); // Clear

            let sx=0, sy=0; if(player.iframes>0 && player.iframes%4===0) { sx=rand(-5,5); sy=rand(-5,5); }
            ctx.save(); ctx.translate(sx, sy);

            // Grid
            ctx.strokeStyle = `hsla(${globalHue}, 80%, 40%, 0.15)`; ctx.lineWidth = 1;
            const gs=50; const off=(frameCount*2)%gs;
            ctx.beginPath();
            for(let x=0; x<=width; x+=gs) { for(let y=0; y<=height; y+=20) { const xw=x+Math.sin(y*0.05+frameCount*0.05)*10; if(y===0)ctx.moveTo(xw,y); else ctx.lineTo(xw,y); }}
            for(let y=off-gs; y<=height; y+=gs) { for(let x=0; x<=width; x+=20) { const yw=y+Math.cos(x*0.05+frameCount*0.05)*10; if(x===0)ctx.moveTo(x,yw); else ctx.lineTo(x,yw); }}
            ctx.stroke();

            powerups.forEach(e=>e.draw(ctx));
            particles.forEach(e=>e.draw(ctx));
            bullets.forEach(e=>e.draw(ctx));
            enemies.forEach(e=>e.draw(ctx));
            texts.forEach(e=>e.draw(ctx));

            // PLAYER DRAW
            if(gameState==='PLAYING' && (player.iframes===0 || Math.floor(frameCount/4)%2===0)) {
                ctx.save(); ctx.translate(player.x, player.y);
                
                // Engine Trails
                player.tail.forEach((t, i) => {
                     ctx.globalAlpha = t.life * 0.6;
                     ctx.fillStyle = '#0ff';
                     ctx.beginPath(); ctx.arc(t.x-player.x, t.y-player.y, 6 * t.life, 0, Math.PI*2); ctx.fill();
                });
                ctx.globalAlpha = 1;

                // SHIELD VISUAL
                if(player.hasShield) {
                    ctx.rotate(frameCount * 0.1);
                    ctx.strokeStyle = '#0af'; ctx.lineWidth = 2;
                    ctx.beginPath(); 
                    ctx.arc(0,0, 35, 0, Math.PI*2); ctx.stroke(); // Outer Ring
                    ctx.setLineDash([5, 5]); 
                    ctx.beginPath(); ctx.arc(0,0, 30, 0, Math.PI*2); ctx.stroke(); // Inner Dashed
                    ctx.setLineDash([]);
                    ctx.fillStyle = 'rgba(0, 200, 255, 0.15)'; ctx.fill();
                    ctx.rotate(-frameCount * 0.1); // Reset rot
                }

                // NEW SHIP SPRITE: INTERCEPTOR
                ctx.fillStyle = '#fff';
                ctx.shadowBlur = 15; ctx.shadowColor = '#0ff';
                
                // Main Body
                ctx.beginPath();
                ctx.moveTo(0, -25); // Nose
                ctx.lineTo(8, 5);
                ctx.lineTo(16, 15); // Wing tip R
                ctx.lineTo(8, 15);
                ctx.lineTo(6, 20); // Engine R
                ctx.lineTo(-6, 20); // Engine L
                ctx.lineTo(-8, 15);
                ctx.lineTo(-16, 15); // Wing tip L
                ctx.lineTo(-8, 5);
                ctx.closePath();
                ctx.fill();
                
                // Cockpit / Core
                ctx.fillStyle = '#022';
                ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(4, 5); ctx.lineTo(0, 8); ctx.lineTo(-4, 5); ctx.fill();

                // Engine Glow
                ctx.shadowBlur = 20; ctx.fillStyle = '#0ff';
                ctx.fillRect(-5, 20, 3, 5); ctx.fillRect(2, 20, 3, 5);

                ctx.restore();
            }
            ctx.restore();

            // Glitch Overlay
            if(frameCount%8===0 && Math.random()>0.8) {
                const h=rand(10,60); const y=rand(0,height-h); const s=rand(-5,5);
                try{ ctx.putImageData(ctx.getImageData(0,y,width,h), s, y); }catch(e){}
            }
            if(frameCount%2===0) {
                 ctx.globalCompositeOperation='overlay'; ctx.fillStyle=`hsla(${globalHue+180},100%,50%,0.05)`;
                 ctx.fillRect(0,0,width,height); ctx.globalCompositeOperation='source-over';
            }
        }

        document.getElementById('start-btn').addEventListener('click', initGame);
        document.getElementById('restart-btn').addEventListener('click', initGame);
        loop();
    </script>
</body>
</html>
