<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON GLITCH HELL: OVERDRIVE</title>
    <link rel="stylesheet" href="src/style.css">
</head>

<body>
    <div id="game-container">
        <!-- SVG Filters Removed for Performance -->

        <div class="scanlines"></div>
        <div class="vignette"></div>
        <div id="flash-overlay"></div>

        <div id="ui-layer" class="hidden">
            <div class="hud-top">
                <div class="hud-left">
                    <button class="score-pause" id="pause-btn" aria-label="Pause or Resume">
                        <div class="pause-icon" aria-hidden="true"></div>
                    </button>
                    <div class="score-block">
                        <div class="score-label">SCORE</div>
                        <div class="score-val" id="score-display">0</div>
                    </div>
                </div>
                <div class="hud-stack">
                    <div class="lives-box" id="lives-container"></div>
                    <div class="power-bar-container">
                        <div class="power-segments" id="power-segments">
                            <div class="segment"></div>
                            <div class="segment"></div>
                            <div class="segment"></div>
                            <div class="segment"></div>
                            <div class="segment"></div>
                        </div>
                        <div class="xp-track">
                            <div class="xp-fill" id="xp-fill"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="start-menu" class="menu-screen">
            <h1>NEON</h1>
            <button class="btn" id="start-btn">ENGAGE</button>
        </div>

        <div id="pause-menu" class="menu-screen hidden">
            <h1 style="color: #0ff;">PAUSED</h1>
            <div class="menu-actions">
                <button class="btn" id="resume-btn">RESUME</button>
                <button class="btn" id="pause-restart-btn">RESTART</button>
                <button class="btn" id="quit-btn">QUIT TO MENU</button>
            </div>
        </div>

        <div id="game-over-menu" class="menu-screen hidden">
            <h1 style="color: #f00;">CRITICAL FAIL</h1>
            <div style="color: #fff; margin-bottom: 10px; letter-spacing: 2px; font-size: 12px;">FINAL SCORE</div>
            <div id="final-score"
                style="font-size: 36px; color: #0ff; font-family: monospace; margin-bottom: 20px; text-shadow: 0 0 10px #0ff;">
                0</div>
            <button class="btn" id="restart-btn">REBOOT</button>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

    <script src="src/game.js"></script>
</body>

</html>
